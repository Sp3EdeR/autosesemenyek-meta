name: 'Update Statistics'
description: 'Updates the statistics from the statistics ICS'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Update Stats
      # This step downloads the published calendar ICS feed and extracts the
      # JSON statistics payload from the event whose summary is "statistics".
      shell: bash
      run: |
        python -m pip install icalendar==6.2.0
        python ".github/scripts/update-stats.py" "https://calendar.google.com/calendar/ical/toyotaesemenyek%40gmail.com/public/basic.ics" "stats.json"
